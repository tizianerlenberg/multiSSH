name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted=$(gofmt -l cmd internal e2e)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi

      - name: vet
        run: go vet ./...

      # The end-to-end tests build both binaries and run them over loopback,
      # including a real PTY, so they need a Linux runner and a few seconds.
      - name: test
        run: go test -race -timeout 10m ./...

  # Windows and macOS are built but never run, so at minimum they must keep
  # compiling -- an agent that does not build is one nobody can install.
  cross-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: sh deploy/build.sh dist
      - run: ls -l dist

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The installer is served to machines that then run it as root. A syntax
      # error would only surface there, part way through an install.
      - name: sh -n
        run: |
          sh -n cmd/proxy/scripts/install.sh
          sh -n deploy/build.sh

      # Severity is capped at 'warning' deliberately: 'info' and 'style' are
      # dominated by intentional word splitting in this script, and a check
      # that has to be ignored is one nobody reads. Tighten it if the noise
      # ever turns out to be worth addressing.
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck --shell=sh --severity=warning \
            cmd/proxy/scripts/install.sh deploy/build.sh

      # The PowerShell installer has never been run on real hardware, so a
      # parse check is the only guard it has.
      - name: parse install.ps1
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/cmd/proxy/scripts/install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) {
            $errors | ForEach-Object { Write-Host $_ }
            exit 1
          }
          Write-Host "install.ps1 parses"
